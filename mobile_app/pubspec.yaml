name: quik_field_notes
description: Quik Field Notes - Cross-platform mobile field scouting companion for Android & iOS.
publish_to: 'none'
version: 2.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/vendor/
