name: Build Quik Field Notes Mobile (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Universal Android APK (Galaxy Note 8 & All Devices)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.19.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Universal Release APK (minSdkVersion 21, MultiDex)
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Rename APK for Release
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk Quik_Field_Notes_Universal.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quik_Field_Notes_Android_Universal
          path: Quik_Field_Notes_Universal.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.0-${{ github.run_number }}
          name: "Quik Field Notes Mobile v2.2.0 (Build #${{ github.run_number }})"
          body: |
            ### 📱 Quik Field Notes Mobile v2.2.0 — Automated Cloud Release
            **Powered by Nasrullah Khan**
            
            #### 📥 Download Links:
            - **Android Universal APK**: Download `Quik_Field_Notes_Universal.apk` from the Assets below.
              *(Compatible with Samsung Galaxy Note 8, Android 7/8/9, and all modern Androids up to Android 15)*
            
            #### 🌟 What's New in v2.2.0:
            - **100% Identical Interface on Android (Galaxy Note 8) & iPhone**
            - **Free Two-Finger Map Rotation**: Twist canvas in any direction to suit terrain perspective
            - **North Arrow Snap**: Tap the compass button to instantly fix/snap orientation back to True North (0°)
            - **Medium-Sized High-Visibility Buttons & Keypads**: Sized for easy touch and readability with weak eyesight or in bright sunlight
            - **Local Map Layer Overlays**: Load ESRI Shapefiles (.zip), GPX, KML, and GeoJSON with live opacity sliders
            - **Tap to Add Waypoint**: Tap anywhere on canvas to drop waypoint with voice dictation
            - **Interactive Digitizing**: Draw lines and polygons with touch/stylus and field comments
            - **Dynamic Project Manager**: Create/switch projects with "No Project" fallback
            - **Customizable Waypoint Categories**: Custom colors and icons
            - **Multi-Format Export**: .scoutpkg, Field Notes CSV, GPX, GeoJSON, Photos
          files: |
            Quik_Field_Notes_Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS Application (iPhone & iPad)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.19.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Prepare iOS Project
        working-directory: mobile_app
        run: |
          flutter create --org com.quikfieldnotes --project-name quik_field_notes --platforms ios .
          flutter pub get

      - name: Build iOS No-Codesign
        working-directory: mobile_app
        run: flutter build ios --release --no-codesign

      - name: Zip iOS Payload
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../../Quik_Field_Notes_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quik_Field_Notes_iOS
          path: Quik_Field_Notes_iOS.ipa

  deploy-pages:
    name: Deploy Web Companion to GitHub Pages (iPhone Instant Access)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: mobile_web_scout
          branch: gh-pages
